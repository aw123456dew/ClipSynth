[project]
name = "frame-cut"
version = "0.1.0"
description = "AI-powered video clipping desktop application"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "PySide6>=6.6.0",
    "qasync>=0.27.0",
    "aiofiles>=23.0",
    "sqlalchemy>=2.0",
    "openai>=1.77.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.2",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.3.0",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frame_cut*"]

[tool.setuptools.package-data]
"frame_cut.resources" = ["icons/*", "styles/*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
